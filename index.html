<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Wheelie Rush V4</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;left:9px;top:7px;font-weight:900;text-shadow:2px 2px #000;pointer-events:none;font-size:14px}#dash{position:fixed;right:7px;top:7px;background:#000d;padding:7px;border-radius:12px;text-align:right;max-width:55%}button,select{font-size:13px;padding:7px;border:0;border-radius:8px;margin:2px}.controls{position:fixed;bottom:8px;width:100%;display:flex;justify-content:space-around}.ctrl{width:19vw;height:59px;font-size:13px;font-weight:900}.yellow{background:#ffd35c}.orange{background:#ff9c32}.shift{background:#b9ddff}#battery,#tempbox{display:inline-block;width:58px;height:14px;border:2px solid #fff;border-radius:3px;vertical-align:middle;padding:1px}#batbar,#tempbar{display:block;height:100%;width:100%;background:#4bd35f}#msg{position:fixed;top:28%;width:100%;text-align:center;font-size:27px;font-weight:1000;text-shadow:3px 3px #000;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="hud">WHEELIE RUSH V4 🔥<br><span id="stats"></span><br><span id="status"></span></div>
<div id="dash"><div id="bikeDash">🔋 <span id="battery"><span id="batbar"></span></span> <span id="bp">100%</span><br>🌡️ <span id="tempbox"><span id="tempbar"></span></span> <span id="tp">65°F</span><br><b id="gear">N</b> <button id="down">− GEAR</button><button id="up">+ GEAR</button><br><button class="orange" id="choke">CHOKE: OFF</button><button class="orange" id="key">🔑 START</button></div><select id="ride"></select></div>
<div id="msg"></div><div class="controls"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl yellow" id="wheel">WHEELIE</button><button class="ctrl shift" id="trick">TRICK</button><button class="ctrl" id="gas">GAS</button></div>
<script>
const C=document.querySelector('#c'),x=C.getContext('2d');let W,H;function rs(){W=C.width=innerWidth;H=C.height=innerHeight}rs();addEventListener('resize',rs);
const rides=[];for(let i=1;i<=10;i++)rides.push({n:`Volt E-Bike ${i}`,t:'E-BIKE',m:42+i,c:`hsl(${190+i*10} 75% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`MX Dirt Bike ${i}`,t:'DIRT BIKE',m:53+i*1.3,c:`hsl(${i*28} 85% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`Turbo Quad ${i}`,t:'TUNED QUAD',m:66+i*1.6,c:`hsl(${295+i*8} 82% 52%)`});
let idx=10,speed=0,angle=0,dist=0,score=0,battery=100,temp=65,started=false,choke=false,gear=0,gas=false,brake=false,wheel=false,trick=false,last=performance.now(),audio=null,nextPulse=0,lastGas=false,turboCharge=0;
const S=document.querySelector('#ride');rides.forEach((r,i)=>S.add(new Option(`${i+1}. ${r.n}`,i)));S.value=10;const R=()=>rides[idx];
function ac(){if(!audio)audio=new (AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function tone(f,d=.08,type='sine',v=.05,end=null){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(audio.destination);o.start();o.stop(t+d)}
function noise(d=.08,v=.03,cut=1000){if(!audio)return;let n=Math.floor(audio.sampleRate*d),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),gn=audio.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;gn.gain.value=v;s.connect(f).connect(gn).connect(audio.destination);s.start()}
function starter(){tone(80,.09,'square',.07,110);setTimeout(()=>tone(105,.13,'sawtooth',.08,145),100);setTimeout(()=>noise(.12,.045,700),220)}
function shiftSound(){tone(150,.045,'square',.045,95);noise(.035,.025,800)}
function blowoff(){noise(.22,.12,5000);tone(1500,.18,'sine',.055,480)}
function engineSound(){if(!audio)return;let now=performance.now();if(now<nextPulse)return;nextPulse=now+42;let r=R();if(r.t==='DIRT BIKE'&&started){let rpm=gear===0?900+gas*2200:1200+speed*90+gas*1600;let base=48+rpm/72;tone(base,.052,'sawtooth',.042,base*.93);tone(base*2.02,.046,'square',.014);noise(.045,.018,900+rpm*.15);if(gas&&Math.random()<.38)noise(.05,.022,1500)}
else if(r.t==='E-BIKE'){if(speed>1||gas)tone(180+speed*10,.05,'sine',.025,195+speed*11)}
else if(r.t==='TUNED QUAD'){if(speed>1||gas){tone(58+speed*4.2,.052,'sawtooth',.04);noise(.045,.015,1200)}if(gas&&speed>18)turboCharge=Math.min(1,turboCharge+.04);else turboCharge=Math.max(0,turboCharge-.05);if(turboCharge>.2&&gas)tone(900+turboCharge*1500,.045,'sine',.018)}}
function flash(s){let m=document.querySelector('#msg');m.textContent=s;clearTimeout(flash.t);flash.t=setTimeout(()=>m.textContent='',700)}
function setControl(id,on,off){let e=document.querySelector('#'+id);e.addEventListener('pointerdown',q=>{q.preventDefault();ac();on()});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,off))}
setControl('gas',()=>gas=true,()=>{gas=false;if(R().t==='TUNED QUAD'&&turboCharge>.28)blowoff()});setControl('brake',()=>brake=true,()=>brake=false);setControl('wheel',()=>wheel=true,()=>wheel=false);setControl('trick',()=>trick=true,()=>trick=false);
document.querySelector('#key').onclick=()=>{ac();if(R().t!=='DIRT BIKE')return;if(battery<=0){flash('🔴 BATTERY DEAD');return}if(!started&&temp<78&&!choke){flash('🥶 COLD — TURN CHOKE ON');tone(50,.2,'square',.05);return}started=!started;if(started){starter();gear=0;flash('🏍️ STARTED')}else{tone(65,.12,'square',.04);gear=0}update()};
document.querySelector('#choke').onclick=()=>{if(R().t==='DIRT BIKE'){choke=!choke;update()}};
document.querySelector('#up').onclick=()=>{if(R().t==='DIRT BIKE'&&started){gear=Math.min(5,gear+1);shiftSound();update()}};
document.querySelector('#down').onclick=()=>{if(R().t==='DIRT BIKE'){gear=Math.max(0,gear-1);shiftSound();update()}};
S.onchange=()=>{idx=+S.value;speed=angle=0;battery=100;temp=65;gear=0;choke=false;started=R().t!=='DIRT BIKE';turboCharge=0;update()};
function update(){let dirt=R().t==='DIRT BIKE';document.querySelector('#bikeDash').style.display=dirt?'block':'none';document.querySelector('#gear').textContent=gear===0?'GEAR N':`GEAR ${gear}`;document.querySelector('#choke').textContent=`CHOKE: ${choke?'ON':'OFF'}`;document.querySelector('#key').textContent=started?'🔑 STOP':'🔑 START';let bb=document.querySelector('#batbar');bb.style.width=battery+'%';bb.style.background=battery<=0?'#e22':battery<=25?'#ff9418':'#49d15d';document.querySelector('#bp').textContent=Math.ceil(battery)+'%';let tv=Math.max(0,Math.min(100,(temp-50)/60*100));document.querySelector('#tempbar').style.width=tv+'%';document.querySelector('#tempbar').style.background=temp<78?'#65b9ff':temp<103?'#58d26c':'#ff7043';document.querySelector('#tp').textContent=Math.round(temp)+'°F'}
function terrain(z){return H*.73+Math.sin(z*.008)*18+Math.sin(z*.023)*6-(Math.max(0,Math.sin(z*.0025))**20)*55}
function world(){let cam=dist*12,q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,'#513c78');q.addColorStop(.58,'#ec855b');q.addColorStop(1,'#9b5d35');x.fillStyle=q;x.fillRect(0,0,W,H);x.fillStyle='#6e4735';x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=7)x.lineTo(X,terrain(X+cam));x.lineTo(W,H);x.fill();x.strokeStyle='#dea25f';x.lineWidth=5;x.beginPath();for(let X=0;X<=W;X+=7){let y=terrain(X+cam)-3;X?x.lineTo(X,y):x.moveTo(X,y)}x.stroke()}
function wh(px,py,r){x.fillStyle='#111';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.strokeStyle='#aaa';x.lineWidth=3;x.beginPath();x.arc(px,py,r-6,0,7);x.stroke();x.strokeStyle='#777';x.lineWidth=1;for(let a=0;a<6.3;a+=.4){x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*(r-7),py+Math.sin(a)*(r-7));x.stroke()}}
function dirtbike(cx,cy,r){x.save();x.translate(cx,cy);x.rotate(-angle);wh(-52,22,24);wh(54,22,24);x.strokeStyle='#b7b7b7';x.lineWidth=5;x.beginPath();x.moveTo(-52,22);x.lineTo(-8,7);x.lineTo(25,-23);x.lineTo(54,22);x.stroke();x.strokeStyle=r.c;x.lineWidth=7;x.beginPath();x.moveTo(-8,7);x.lineTo(-28,-27);x.lineTo(23,-23);x.lineTo(-8,7);x.stroke();
x.fillStyle='#555';x.roundRect(-19,-5,36,30,5);x.fill();x.fillStyle='#222';x.fillRect(-11,0,20,20);for(let i=0;i<4;i++){x.strokeStyle='#888';x.lineWidth=1;x.beginPath();x.moveTo(-12,3+i*4);x.lineTo(10,3+i*4);x.stroke()}x.strokeStyle='#aaa';x.lineWidth=5;x.beginPath();x.moveTo(13,15);x.quadraticCurveTo(-5,29,-44,2);x.stroke();x.fillStyle='#aaa';x.roundRect(-52,-3,27,8,3);x.fill();
x.fillStyle=r.c;x.beginPath();x.moveTo(-31,-34);x.lineTo(16,-36);x.lineTo(32,-19);x.lineTo(-15,-13);x.closePath();x.fill();x.fillStyle='#111';x.roundRect(-46,-42,62,9,4);x.fill();let bend=Math.max(0,angle-.16)*40;x.fillStyle=r.c;x.beginPath();x.moveTo(-40,-39);x.quadraticCurveTo(-62,-48-bend*.3,-84,-36-bend);x.lineTo(-80,-28-bend*.82);x.quadraticCurveTo(-58,-35-bend*.15,-37,-31);x.closePath();x.fill();x.beginPath();x.moveTo(30,-26);x.quadraticCurveTo(55,-37,77,-20);x.lineTo(71,-13);x.quadraticCurveTo(52,-24,32,-16);x.fill();
x.strokeStyle='#333';x.lineWidth=4;x.beginPath();x.moveTo(26,-32);x.lineTo(35,-52);x.lineTo(49,-54);x.stroke();x.fillStyle='#202020';x.beginPath();x.arc(1,-70,11,0,7);x.fill();x.fillStyle='#eee';x.fillRect(6,-73,11,4);x.strokeStyle='#242424';x.lineWidth=9;x.beginPath();x.moveTo(0,-58);x.lineTo(-10,-34);x.lineTo(5,-20);x.moveTo(-4,-54);x.lineTo(24,-44);x.lineTo(40,-50);x.moveTo(-7,-32);x.lineTo(-30,-2);x.lineTo(-49,13);x.stroke();x.restore()}
function quad(cx,cy,r){x.save();x.translate(cx,cy);x.rotate(-angle);wh(-50,22,24);wh(50,22,24);x.fillStyle=r.c;x.beginPath();x.roundRect(-51,-14,102,27,7);x.fill();x.fillStyle='#333';x.roundRect(-20,-25,44,16,4);x.fill();x.fillStyle='#aaa';x.fillRect(20,-4,30,7);x.strokeStyle='#bbb';x.lineWidth=4;x.beginPath();x.moveTo(18,-17);x.lineTo(31,-42);x.lineTo(46,-44);x.stroke();x.fillStyle='#222';x.beginPath();x.arc(0,-61,10,0,7);x.fill();x.strokeStyle='#222';x.lineWidth=8;x.beginPath();x.moveTo(0,-51);x.lineTo(-7,-27);x.moveTo(-3,-47);x.lineTo(28,-38);x.stroke();x.restore()}
function ebike(cx,cy,r){x.save();x.translate(cx,cy);x.rotate(-angle);wh(-45,21,22);wh(45,21,22);x.strokeStyle=r.c;x.lineWidth=7;x.beginPath();x.moveTo(-45,21);x.lineTo(-6,-15);x.lineTo(45,21);x.lineTo(0,21);x.lineTo(-45,21);x.stroke();x.fillStyle='#222';x.fillRect(-13,-13,20,31);x.restore()}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t;let r=R(),can=r.t!=='DIRT BIKE'||(started&&battery>0);if(r.t==='DIRT BIKE'&&started){let heat=(choke?8:3.8)+(gas?4:0);temp=Math.min(110,temp+heat*dt);battery=Math.max(0,battery-dt*(gas?.10:.012));if(temp>88&&choke){temp=Math.min(110,temp+3*dt)}if(battery<=0){started=false;gear=0;flash('🔴 BATTERY DEAD')}}if(can){let drive=0;if(r.t==='DIRT BIKE'){if(gear>0){let ratios=[0,1,1.35,1.65,1.9,2.1];drive=gas*(34/ratios[gear]);let cap=[0,24,36,48,59,r.m][gear];if(speed>cap)drive-=22}else drive=0}else drive=gas?34:0;speed+=(drive-(brake?50:7))*dt;speed=Math.max(0,Math.min(r.m,speed));let target=wheel&&speed>7?Math.min(1.05,.23+speed/92):0;angle+=(target-angle)*4.2*dt;if(angle>.35&&speed>9)score+=speed*dt*.6;dist+=speed*dt/3.6}else speed=Math.max(0,speed-18*dt);
engineSound();world();let bx=W*.43,by=terrain(bx+dist*12)-30;r.t==='DIRT BIKE'?dirtbike(bx,by,r):r.t==='TUNED QUAD'?quad(bx,by,r):ebike(bx,by,r);document.querySelector('#stats').innerHTML=`${r.n}<br>${speed.toFixed(0)} MPH • ⭐ ${Math.floor(score)} • ${Math.floor(dist)}m`;document.querySelector('#status').textContent=r.t==='DIRT BIKE'?(started?(gear===0?'🟢 RUNNING • SHIFT INTO 1ST':'🟢 RUNNING'):'⚫ ENGINE OFF'):(r.t==='TUNED QUAD'?`💨 TURBO ${Math.round(turboCharge*100)}%`:'⚡ READY');update();lastGas=gas;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
